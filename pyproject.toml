[project]
name = "project-mcp"
version = "0.1.0"
description = "using mcp with langchain"
readme = "README.md"
authors = [
    { name = "EddyGiusepe", email = "eddychirinos.unac@gmail.com" }
]
requires-python = ">=3.13.7, <=3.14.5"
dependencies = [
    "fastmcp==4.1.5",
    "langchain==1.4.8",
    "langchain-openai==1.7.3",
    "python-math==0.0.1",
]

[dependency-groups]
dev = [
    "ruff==0.17.3",
]

[tool.ruff]
extend = "ruff.toml"